# =============================================================================
# One container: the MuJoCo sim, its browser viewer and its UDP links. No ROS.
#
#   cp .env.example .env            # set ROBOT_WS to your workspace checkout
#   docker compose build
#   docker compose up -d            # starts the sim + its browser viewer (http://localhost:8080)
#   docker compose logs -f sim      # the sim's output
#   docker compose exec sim bash    # then see README "Running"
#
# The workspace is mounted, not copied, for two things only: the maps under
# its map/ and the robot's URDF and meshes under src/syncai_bringup. Nothing
# in it is built or run here.
#
# The instance INI is bind-mounted over the workspace's config/system.ini, so
# the map and the spawn pose come from it (config.py resolves its relative
# paths from the workspace root). It is a single-file mount: edit it in place
# (no rename).
# =============================================================================

name: syncai-sim

services:
  sim:
    build:
      context: .
      dockerfile: Dockerfile
    image: syncai-robot-sim
    container_name: syncai-sim
    # Host uid/gid so files written into the mounts (cache/, log/) keep the
    # host user's ownership; HOME is world-writable in the image for this.
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /home/syncrobotic/robot_ws
    stdin_open: true
    tty: true
    # PID 1 is the entry script (then `sleep infinity`), which never reaps;
    # Docker's init reaps what the shells under `docker compose exec` leave.
    init: true
    # bridge (the default): the ports below reach the sim from the host. host:
    # the sim's sockets are the host's (the ports below are then ignored);
    # what a controller process on the host machine finds most simply.
    network_mode: "${SIM_NETWORK_MODE:-bridge}"
    ports:
      - "${SIM_WEB_VIEW_PORT:-8080}:8080"   # the browser viewer (viewer/web_view.py)
      # The sim's UDP input. Its outputs go where the params say:
      # link_state_host:link_state_port (30010) and the panel's keys and AXES
      # to controller_command_port (50051); from a bridge network to a program
      # on the host, set link_state_host to host.docker.internal.
      - "20001:20001/udp"   # the hardware link: a controller's joint commands
    environment:
      HOME: /home/syncrobotic
      # numba's parallel ray caster on OpenMP (gcc's libgomp).
      NUMBA_THREADING_LAYER: omp
      PYTHONUNBUFFERED: "1"
      # What the container starts (scripts/sim_entry.sh): the sim and its
      # browser viewer, unless SIM_AUTOSTART is 0.
      SIM_AUTOSTART: "${SIM_AUTOSTART:-1}"
      SIM_ARGS: "${SIM_ARGS:---teleop}"
    volumes:
      - ${ROBOT_WS:-../SyncAI-Robot-Workspace}:/home/syncrobotic/robot_ws
      - .:/home/syncrobotic/sim
      # The instance file (the map, the spawn), over the workspace's
      # config/system.ini. Single-file: edit it in place, never rename over it
      # (a rename gives the content a new inode this mount never sees).
      - ${SIM_INSTANCE_INI:-./config/instances/sim01.ini}:/home/syncrobotic/robot_ws/config/system.ini
    # The sim and its viewer at start (http://localhost:8080), then the
    # container stays up for `docker compose exec sim bash` whatever the sim
    # does; its output is `docker compose logs -f sim`.
    command: ["/home/syncrobotic/sim/scripts/sim_entry.sh"]
