; The sim's instance INI. docker-compose.yml bind-mounts it over
; /home/syncrobotic/robot_ws/config/system.ini, exactly as the robot's compose
; does with config/instances/robotNN.ini and as the workspace CI does for its
; smoke test, so every launch file in the mounted workspace reads it unchanged.
;
; robot_id `sim01` is deliberately not a robotNN: node namespaces, topics and
; TF frames all carry it, so even on a shared DDS domain nothing here can
; collide with a live robot01.
;
; [map] name is the directory under <workspace>/map/ to simulate — a map with an
; octomap.bt (written by syncai_mapping's clean_map --octomap 1). The pcd key
; keeps the workspace's interpolation form so the launch files derive their
; paths the usual way; the sim itself reads `pcd` and takes octomap.bt from its
; directory, like planner_server.launch.py does. (The 2D-era `map:` key, a
; gridmap.yaml for map_server, went with 2D navigation, 2026-10-28.)
;
; [initial_pose] is where the robot spawns, in the map frame. z is the GROUND
; height at that spot (the sim snaps to the nearest floor anyway), so a map
; whose ground floor sits at z = 0 keeps z: 0.0.
;
; There is NO [sensor.lidar] section: the sim replaces the Livox driver, and
; bringup.launch.py (which would raise without an ip) is not started — the
; session runs robot_state_publisher directly.

[system]
robot_id: sim01

[map]
name: dp
pcd: map/%(name)s/map.pcd

[initial_pose]
x: 0.0
y: 0.0
z: 0.0
yaw: 0.0
