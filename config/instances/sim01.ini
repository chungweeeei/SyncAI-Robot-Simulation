; The sim's instance INI. docker-compose.yml bind-mounts it over
; /home/syncrobotic/robot_ws/config/system.ini; the sim reads it at start
; (syncai_sim/config.py read_ini).
;
; [map] name is the directory under <workspace>/map/ to simulate — a map with an
; octomap.bt (written by syncai_mapping's clean_map --octomap 1). The sim reads
; `pcd` and takes octomap.bt (and poses.txt, map.pcd) from its directory; a
; relative path is resolved from the workspace root.
;
; [initial_pose] is where the robot spawns, in the map frame. z is the GROUND
; height at that spot (the sim snaps to the nearest floor anyway), so a map
; whose ground floor sits at z = 0 keeps z: 0.0.
;
; [system] robot_id names the run; nothing in the sim depends on it.

[system]
robot_id: sim01

[map]
name: dp
pcd: map/%(name)s/map.pcd

[initial_pose]
x: 0.0
y: 0.0
z: 0.0
yaw: 0.0
