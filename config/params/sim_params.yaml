# Every sim parameter (config.PARAM_DEFAULTS has the same keys), with why
# each value is what it is. python3 -m syncai_sim always loads this file, then
# each --profile, then -p key:=value. A plain mapping: an unknown key is an
# error at load.
#
# The sim is the robot's hardware: the joints are a controller process's
# over the hardware link (syncai_sim/locomotion/hardware_link.py), the lidar
# goes out on the Livox protocol. It walks nowhere by itself.

# --- world ---------------------------------------------------------------
# The map comes from the INI ([map] pcd -> its directory's octomap.bt), like
# planner_server.launch.py derives it; `map_dir` overrides it when set.
map_dir: ""
cache_dir: ""         # default: <sim repo>/cache/<map name>
# Viewer mesh only (world.py): faces higher than this above their column's
# lowest voxel are not in the picture (dp: every face is 3.5 M triangles,
# 3 m keeps 2.5 M; what the browser is sent, and what the llvmpipe window
# of before drew at 181 / 119 ms a frame). The lidar and the collision
# queries read the full grid regardless. 0 = draw all.
visual_max_height_above_column_floor_m: 3.0
plate_min_voxels: 16         # 18 k plates on dp; the floor under a prop is covered at 16, not at 100
clip_spikes_above_neighbours_m: 0.1   # the mapping robot's own feet and one-return posts (world.py); 0 keeps them
track_floor_fill_radius_m: 0.30       # put floor under the mapping robot where the map has none (world.py); 0 = off
track_clear_radius_m: 0.30            # erase what stands where the mapping robot's body was (world.py); 0 = off
floor_hole_max_cells: 25              # fill enclosed floor holes up to 0.25 m^2 (world.py); 0 = off
# Floor wherever the planner infers one (world.py): the passes of
# syncai_global_planner's SurfaceMapParams::hole_fill_passes. 0 = off.
planner_hole_fill_passes: 2
# The site the viewer starts with (its panel switches between them; each
# is built once and cached, site_tiles.py): "voxels" = the octomap's cubes,
# what the sim senses and the planner plans on; "pointcloud" = a smooth
# Poisson surface from <map>/map.pcd (pcd_mesh.py; dp ~3.5 min the first
# time; blurs thin structure, bubbles where the map is sparse); "tsdf" = a
# TSDF surface integrated from the mapping run's own keyframe patches
# (tsdf_mesh.py; dp ~5 min the first time; keeps thin structure, leaves
# unseen places open). All three shaded by the lidar's intensity. A
# picture either way.
visual_mesh: voxels
# The site's look (the panel's Look switch; visual.py): "ramp" = colour
# by height, shaded by the lidar's intensity; "photo" = the colour the
# mapping run's camera saw at each voxel (voxel_colour.py), from
# config/colour/<map>.npz built by scripts/colour_map.py out of the run's
# bag; without that file the ramp is shown. Grey where the camera never
# looked (the robot's back, ceilings).
visual_look: ramp
# The browser viewer (viewer/web_view.py): its port inside the container
# (docker-compose.yml maps it to SIM_WEB_VIEW_PORT, 8080).
web_view_port: 8080

# --- spawn ---------------------------------------------------------------
# Default: the INI's [initial_pose] (x, y, z = ground, yaw). z is a hint for
# which floor; the sim snaps to the ground under (x, y) nearest to it.
use_ini_initial_pose: true
spawn: [0.0, 0.0, 0.0, 0.0]   # x y z yaw, used when use_ini_initial_pose is false

# --- robot geometry (syncai_global_planner / syncai_controller params) -----
lidar_height: 0.481          # lidar_top_imu over the ground when standing

# --- lidar (Livox MID360, bringup.yaml publish_freq 10) -------------------
# mid360: the directions and firing times the robot's own lidar fired, from
# a recording (config/lidar/mid360_pattern.npz, built by
# scripts/lidar_pattern.py from the workspace's record/dp; lidar.py), frame
# after frame, each ray cast from where the lidar was when it fired.
# random: fresh uniform directions every scan, the sim before 2026-10-26.
lidar_pattern: mid360
lidar_pattern_file: ""       # "" = config/lidar/mid360_pattern.npz
points_per_scan: 20000       # random: exactly; mid360: at most (a frame fires ~16 k that return)
scan_rate_hz: 10.0
fov_lower_deg: -7.0          # random only: the recording fires what the MID360 fires (-7.0..52.7)
fov_upper_deg: 52.0
lidar_min_range: 0.1
lidar_max_range: 40.0
range_noise_sigma: 0.01      # along the ray; 2 cm pushes returns across the 0.1 m voxel steps (lidar.py)

# --- the controller ----------------------------------------------------------
# The viewer panel's motion keys, policy numbers and AXES go to the
# controller process as the ASCII lines driver_manager sends
# (driver/udp_driver.py); the controller (SyncAI-Robot-Control) binds this.
controller_command_ip: 127.0.0.1    # the controller's address
controller_command_port: 50051      # the controller's command port

# --- the lidar on the network ------------------------------------------------
# none: the scans stay in the sim (the viewer draws them).
# livox: the sim is the robot's MID360 / MID360s on the Livox protocol
#   (sensor/livox_link.py): the workspace's livox_ros_driver2 finds it and
#   reads its points and IMU as it reads the robot's, so Point-LIO, the
#   localizer and the planner run on the sim. Its IP has to be an address of
#   this host and the driver's host_ip another (README, "The sim as the
#   robot's lidar").
lidar_link: none
livox_lidar_ip: ""            # "" = the INI's [sensor.lidar] ip, the driver's lidar_configs ip
livox_lidar_type: ""          # mid360 | mid360s; "" = the INI's [sensor.lidar] type (the JSON is keyed by it)
livox_points_per_packet: 96   # the MID360's own
livox_imu_hz: 200.0           # the MID360's own; Point-LIO warns past a 30 ms gap

# --- the hardware link (syncai_sim/locomotion/hardware_link.py) -------------
# The controller's --backend sim must use the same ports.
link_command_port: 20001     # joint commands in
link_state_host: "127.0.0.1" # the body's record out, to here
link_state_port: 30010
# After this long without a command the motors fall back to damping (kp 0,
# kd 2: the controller's own JointDamping state), so a controller that died
# does not leave its last torque on the joints.
link_watchdog_ms: 100.0

# --- the joints on SocketCAN (syncai_sim/locomotion/can_link.py) ------------
# udp: the joint commands are the hardware link's command datagram (above).
# can: the twelve joints are J60 motors on four CAN buses, one per leg, as
#   on the robot — its frames, its motor ids, its homed zero and directions —
#   so a controller's SocketCAN hardware layer drives the sim as it drives
#   the robot. The interfaces must exist where the sim runs: vcan ones of
#   the robot's names (scripts/vcan_up.sh; the container on the host's
#   network, SIM_NETWORK_MODE=host). The state datagram above is still sent
#   (the IMU, the base's truth and the contacts are on no CAN bus); the
#   command port is not read. link_watchdog_ms is then each motor's CAN
#   timeout at power-up, until SET_CAN_TIMEOUT.
joint_link: udp
can_interfaces: [can1, can2, can3, can4]   # HR, FR, FL, HL (the G2.3's verified mapping)
can_motor_ids: [2, 3, 4]                   # HipX, HipY, Knee on every bus
# vcan delivers every frame at once; these put a bus's faults back, per bus.
can_delay_ms: [0.0, 0.0, 0.0, 0.0]         # CONTROL commands held this long before the motor acts
can_drop_rate: [0.0, 0.0, 0.0, 0.0]        # fraction of received frames lost (not applied, not answered)

# --- the body IMU on a serial port (syncai_sim/sensor/imu_serial.py) --------
# none: the body IMU is only in the state datagram above.
# serial: the sim is also the robot's Yesense IMU, streaming its frames
#   (acceleration, angular rate, Euler angles) on a pseudo-terminal that
#   imu_serial_port links to, as the unit does on /dev/ttyTHS1: the
#   controller's own serial reader parses it. The pseudo-terminal is in the
#   sim's container; a real serial device named here is written instead.
imu_link: none
imu_serial_port: /tmp/syncai_imu
imu_serial_hz: 200.0         # not known for the robot's unit; 115200 baud carries at most 235 of this frame

# --- the BMS on CAN (syncai_sim/sensor/bms_link.py) -------------------------
# none: no battery.
# can: the sim is the pack's BMS (Foxlink Jeff-8S3P) on the robot's fifth
#   bus, extended frames: silent until asked, 0x87 starts the cycle of
#   voltages, current, temperatures, state and SOC. A vcan interface, as
#   for the joints (scripts/vcan_up.sh makes can0 too).
bms_link: none
bms_interface: can0
bms_period_ms: 100.0         # the whole table once started; not in the protocol document
bms_soc: 0.8                 # at start, 0..1
bms_capacity_ah: 15.0        # 8S3P of 5 Ah cells, assumed
bms_idle_w: 40.0             # drawn with the motors at rest (computer, lidar, drivers), assumed

# --- the feet's floor -------------------------------------------------------
# fitted: the flights surface_heights.py fitted are fixed boxes, one per
# tread at the fitted depth (stairs.py); voxels: the patch's 0.1 m boxes
# there too, which put every riser on the column grid (treads 0.20 / 0.30 m
# for dp's 0.22-0.255). voxels is the sim before 2026-10-25, for comparison.
stairs: fitted

# --- the body's physics ------------------------------------------------------
# Set the way a controller's own development simulation models the robot,
# so what it sees here is what it would see there (README, "The body's
# physics, as knobs", records where each value comes from and what the A/B
# against the old defaults measured; robot.py cites the lines). The
# alternative of each is the sim before 2026-10-26.
motor_model: j60             # j60: the J60's torque-speed envelope, armature, friction, damping | ideal: URDF effort clamp, armature 0.01
trunk_inertial: vendor       # vendor: the vendor MJCF's TORSO, 9.368 kg, 2.5x the pitch inertia | urdf: base_link 8.03 kg
foot_solref: [0.005, 1.0]    # legs / feet / terrain boxes contact, the vendor's (stiffer than MuJoCo's [0.02, 1.0])
foot_friction: [1.0, 0.01, 0.01]   # sliding, torsional, rolling, the vendor's
integrator: euler            # euler | implicitfast (joint damping integrated implicitly)
cmd_delay_ms: 0.0            # motor commands held back this long (G2_SIM_CMD_DELAY_MS there)
torque_bw_hz: 0.0            # first-order torque filter; 0 = off (G2_SIM_TORQUE_BW_HZ)

# --- rates -----------------------------------------------------------------
# Every physics step is one state datagram; at 1 kHz a controller's 1 ms
# loop sees a new timestamp each tick (500 works too: it reads each state
# twice).
physics_hz: 1000.0
# A late loop catches up at most this much sim time in one burst, and
# drops the rest (envs/pacing.py), so a controller is never handed a
# quarter second of states in a few ms while its command stays the same.
max_catch_up_s: 0.008

# --- props -----------------------------------------------------------------
# JSON list of PropSpec dicts (scene.py). A mover has waypoints and walks
# between them; a prop without waypoints is a free body the trunk can push.
props_json: >-
  []
