# Floors that slope across voxel boundaries, for surface_heights.py's ramp
# smoothing (its module docstring): per ramp a box [x0, x1, y0, y1] in the map
# frame and the band [z0, z1] of tops that are its floor (walls, pillars and
# anything else in the box stay out of it).

ramps:
  # The open ground east of the mapping track around (35, 11): a gentle slope
  # from -0.9 in the west to -1.1 in the east, across two voxel layers. Its
  # points lie in two sheets ~0.1 m apart (map.pcd: 10th percentile -1.10, 90th
  # -1.01 in the same 10 cm cell, passes that disagree in z), and where a cell
  # got only the lower sheet the octomap lost its -1.1..-1.0 voxel: tongues of
  # the lower layer 0.3-0.4 m wide and ~0.8 m long reach into the upper one,
  # 10 cm pits on site where there is no gutter. Open on one side, they are no
  # enclosed hole for fill_floor_holes, too narrow for the patch's 6-of-8 fill,
  # and 0.8 m off the track for blend_track_seams. PPO stepped into the one at
  # (35.36, 10.84) and fell (roll -31, pitch 32 deg; 2026-10-29).
  - name: outdoor_1027 slope east of the track at (35, 11)
    box: [33.0, 39.0, 8.5, 14.5]
    band: [-1.25, -0.8]
